name: Validate

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate term data
        run: npm run validate

      - name: Verify sources (changed terms)
        if: github.event_name == 'pull_request'
        run: node scripts/verify-sources.mjs --base origin/${{ github.base_ref }}

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Antigravity change scope
        if: startsWith(github.head_ref, 'antigravity/')
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          bad=$(echo "$changed" | grep -Ev '^(data-inbox/|src/data/terms/|docs/PROJECT_STATE\.md$)' || true)
          if [ -n "$bad" ]; then
            echo "antigravity/* ブランチは data-inbox/・src/data/terms/ のみ変更できます。範囲外:"
            echo "$bad"
            exit 1
          fi

      - name: Antigravity append-only guard
        if: startsWith(github.head_ref, 'antigravity/') && !startsWith(github.head_ref, 'antigravity/review-')
        run: |
          # 既存用語の書き換えは Claude Code の担当。src/data/terms/ は行の追加のみ許可
          # (例外: 孤立語の解消による relatedSlugs 行の更新、出典の見直しによる sources 行の差し替え)
          bad=$(git diff -U0 origin/${{ github.base_ref }}...HEAD -- src/data/terms | grep -E '^-[^-]' | grep -Ev '^-    (relatedSlugs|sources): ' || true)
          if [ -n "$bad" ]; then
            echo "antigravity/* ブランチは既存の用語行を変更・削除できません。既存語の訂正は docs/PROJECT_STATE.md の申し送りに書いてください。変更された行:"
            echo "$bad" | head -20
            exit 1
          fi
